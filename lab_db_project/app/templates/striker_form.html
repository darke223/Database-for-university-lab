<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>
        {% if is_edit %}Редактировать ударник №{{ striker.id_striker }}{% else %}Добавить ударник{% endif %}
    </title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f8f9fa; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 30px; text-align: center; }
        label { display: block; margin-top: 20px; font-weight: bold; color: #444; }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        textarea.json-area { font-family: monospace; font-size: 14px; background: #fafafa; height: 120px; }
        button {
            margin-top: 40px;
            padding: 14px 28px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background: #218838; }
        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #007bff;
            text-decoration: none;
        }
        .info { font-size: 0.85em; color: #666; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            {% if is_edit %}🔨 Редактировать ударник №{{ striker.id_striker }}{% else %}🔨 Регистрация ударного элемента{% endif %}
        </h1>
        <form action="{% if is_edit %}/strikers/{{ striker.id_striker }}/edit{% else %}/strikers/new{% endif %}" method="post">
            <label>Материал</label>
            <input type="text" name="material" value="{% if is_edit %}{{ striker.material }}{% endif %}" placeholder="Например: Сталь 40Х" required>

            <label>Геометрические размеры (JSON)</label>
            <div class="info">Параметры в формате JSON</div>
            <textarea name="geometry_json" class="json-area" required>{% if is_edit %}{{ geom_str }}{% else %}{
  "диаметр_мм": 12.0,
  "длина_мм": 150.0,
  "масса_г": 125.5
}{% endif %}</textarea>

            <button type="submit">💾 {% if is_edit %}Сохранить изменения{% else %}Создать ударник{% endif %}</button>
        </form>
        <a href="/strikers/" class="back-link">← К списку ударников</a>
        <a href="/" class="back-link">🏠 На главную</a>
    </div>
</body>
</html>
