<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% if is_edit %} Редактирование материала {% else %} Новый материал {% endif %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f8f9fa; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        label { display: block; margin-top: 20px; font-weight: bold; color: #444; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            margin-top: 40px;
            padding: 14px 28px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }
        button:hover { background: #218838; }
        .back-link {
            display: block;
            margin-top: 30px;
            text-align: center;
            color: #007bff;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            {% if is_edit %}
                Редактирование материала №{{ material.id_material }}
            {% else %}
                Добавление нового материала
            {% endif %}
        </h1>

        <form method="post">
            <label>Название материала</label>
            <input type="text"
                   name="name"
                   value="{% if is_edit %}{{ material.name }}{% endif %}"
                   placeholder="Например: Сталь 45, Алюминий Д16Т"
                   required>

            <button type="submit">
                {% if is_edit %} Сохранить изменения {% else %} Добавить материал {% endif %}
            </button>
        </form>

        <a href="/materials/" class="back-link">← Вернуться к списку материалов</a>
        <a href="/" class="back-link">🏠 На главную</a>
    </div>
</body>
</html>
