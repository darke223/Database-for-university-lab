<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ударники</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #fff; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 12px; text-align: left; }
        th { background-color: #f4f4f4; }
        .btn-new { display: inline-block; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .btn-new:hover { background: #0056b3; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-delete:hover { background: #c82333; }
        tr:hover { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔨 Ударные элементы (Strikers)</h1>
            <a href="/strikers/new" class="btn-new">➕ Новый ударник</a>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Материал</th>
                    <th>Размеры</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for s in strikers %}
                <tr>
                    <td>{{ s.id_striker }}</td>
                    <td>{{ s.material }}</td>
                    <td>{{ s.geometric_dimensions | format_json }}</td>
                    <td style="display: flex; gap: 8px;">
                        <a href="/strikers/{{ s.id_striker }}/edit" class="btn-new" style="background: #ffc107; color: #000; padding: 6px 12px; font-size: 0.9em;">Редактировать</a>
                        <form action="/strikers/{{ s.id_striker }}/delete" method="post" onsubmit="return confirm('Удалить этот ударник?');" style="margin: 0;">
                            <button type="submit" class="btn-delete">Удалить</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
        <br>
        <a href="/">🏠 На главную</a>
    </div>
</body>
</html>
