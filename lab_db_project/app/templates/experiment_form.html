<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>
        {% if is_edit %}
            Редактирование эксперимента №{{ exp.id_experiment }}
        {% else %}
            Новый эксперимент
        {% endif %}
    </title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f8f9fa; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 30px; text-align: center; }
        label { display: block; margin-top: 20px; font-weight: bold; color: #444; }
        select, input[type="date"], textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        textarea { resize: vertical; min-height: 100px; }
        button {
            margin-top: 40px;
            padding: 14px 28px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }
        button:hover { background: #218838; }
        .back-link {
            display: block;
            margin-top: 30px;
            text-align: center;
            color: #007bff;
            text-decoration: none;
            font-size: 16px;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            {% if is_edit %}
                Редактирование эксперимента №{{ exp.id_experiment }}
            {% else %}
                Создание нового эксперимента
            {% endif %}
        </h1>

        <form method="post"
              {% if is_edit %}
                  action="/experiments/{{ exp.id_experiment }}/edit"
              {% else %}
                  action="/experiments/new"
              {% endif %}>

            <label>Образец</label>
            <select name="id_sample" required>
                {% for s in samples %}
                <option value="{{ s.id_sample }}"
                        {% if is_edit and exp.id_sample == s.id_sample %}selected{% endif %}>
                    №{{ s.id_sample }} — материал: {{ s.material.name }}
                    {% if s.description %} ({{ s.description }}) {% endif %}
                </option>
                {% endfor %}
            </select>

            <label>Тип эксперимента</label>
            <select name="experiment_type_code" required>
                {% for t in types %}
                <option value="{{ t.experiment_type_code }}"
                        {% if is_edit and exp.experiment_type_code == t.experiment_type_code %}selected{% endif %}>
                    {{ t.name }}
                </option>
                {% endfor %}
            </select>

            <label>Статус</label>
            <select name="id_status" required>
                {% for st in statuses %}
                <option value="{{ st.id_status }}"
                        {% if is_edit and exp.id_status == st.id_status %}selected{% endif %}>
                    {{ st.name }}
                </option>
                {% endfor %}
            </select>

            <label>Ударяющий элемент (Striker)</label>
            <select name="id_striker" required>
                {% for sk in strikers %}
                <option value="{{ sk.id_striker }}"
                        {% if is_edit and exp.id_striker == sk.id_striker %}selected{% endif %}>
                    №{{ sk.id_striker }} — {{ sk.material }}
                </option>
                {% endfor %}
            </select>

            <label>Нагружающий стержень</label>
            <select name="loading_rod_id" required>
                {% for r in rods %}
                <option value="{{ r.id_rod }}"
                        {% if is_edit and exp.loading_rod_id == r.id_rod %}selected{% endif %}>
                    №{{ r.id_rod }} — {{ r.material }}
                </option>
                {% endfor %}
            </select>

            <label>Опорный стержень</label>
            <select name="support_rod_id" required>
                {% for r in rods %}
                <option value="{{ r.id_rod }}"
                        {% if is_edit and exp.support_rod_id == r.id_rod %}selected{% endif %}>
                    №{{ r.id_rod }} — {{ r.material }}
                </option>
                {% endfor %}
            </select>

            <label>Контракт</label>
            <select name="id_contract" required>
                {% for c in contracts %}
                <option value="{{ c.id_contract }}"
                        {% if is_edit and exp.id_contract == c.id_contract %}selected{% endif %}>
                    №{{ c.id_contract }} — клиент: {{ c.customer.name }}
                </option>
                {% endfor %}
            </select>

            <label>Дата эксперимента</label>
            <input type="date" name="experiment_date"
                   value="{% if is_edit %}{{ exp.experiment_date }}{% endif %}"
                   required>

            <label>Комментарий (необязательно)</label>
            <textarea name="comments" rows="5">{% if is_edit %}{{ exp.comments or '' }}{% endif %}</textarea>

            <button type="submit">
                {% if is_edit %}
                    Сохранить изменения
                {% else %}
                    Создать эксперимент
                {% endif %}
            </button>
        </form>

        <a href="/experiments/" class="back-link">← Вернуться к списку экспериментов</a>
        <a href="/" class="back-link">🏠 На главную</a>
    </div>
</body>
</html>
