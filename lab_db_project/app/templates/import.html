<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Импорт экспериментов</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f8f9fa; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .upload-box { border: 2px dashed #007bff; padding: 30px; text-align: center; border-radius: 8px; margin: 30px 0; background: #f0f7ff; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 1.1em; cursor: pointer; }
        button:hover { background: #218838; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📥 Импорт данных из ZIP</h1>
        <p>Выберите ZIP-архив, созданный системой на другом компьютере. Все эксперименты, файлы и связанные справочники будут воссозданы автоматически.</p>
        
        <form action="/experiments/import" method="post" enctype="multipart/form-data">
            <div class="upload-box">
                <input type="file" name="zip_file" accept=".zip" required>
            </div>
            <button type="submit">🚀 Импортировать данные</button>
        </form>
        
        <a href="/experiments/" class="back-link">← Вернуться к списку</a>
    </div>
</body>
</html>
